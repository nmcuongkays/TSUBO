name: Update Tsubogawa data

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, offset from the top of the hour.
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

permissions:
  contents: write

concurrency:
  group: tsubogawa-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch official Gifu water + camera data
        run: python scripts/update.py

      - name: Commit changed data
        run: |
          git config user.name "tsubogawa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -m "Update Tsubogawa data"
            git pull --rebase origin main
            git push origin main
          fi
